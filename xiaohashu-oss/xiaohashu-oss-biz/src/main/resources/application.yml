server:
  port: 8083 # 项目启动的端口

spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  servlet:
    multipart:
      max-file-size: 100MB # 限制单个上传文件的最大大小为 20MB
      max-request-size: 100MB # 限制整个上传请求的最大大小为 20MB

knife4j:
  enable: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
