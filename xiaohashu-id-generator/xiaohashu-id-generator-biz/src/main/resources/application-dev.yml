spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  application:
    name: xiaohashu-distributed-id-generator
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xiaohashu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234

server:
  port: 8085
  tomcat:
    threads:
          max: 400
          min-spare: 50
    accept-count: 500
    max-connections: 10000