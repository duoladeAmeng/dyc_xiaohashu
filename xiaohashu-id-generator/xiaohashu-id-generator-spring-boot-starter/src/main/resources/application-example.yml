distributed-id:
  namespace: xiaohashu
  jdbc:
    initialize-schema: false

  snowflake:
    enabled: true
    epoch: 2025-01-01T00:00:00Z
    timestamp-bits: 41
    machine-bits: 10
    sequence-bits: 12
    clock-backwards:
      spin-threshold: 1ms
      max-wait: 500ms

  machine:
    allocator: jdbc
    instance-id:
    stable: false
    heartbeat-interval: 10s
    lease-timeout: 30s
    max-heartbeat-failures: 2
    shutdown-timeout: 5s

  segment:
    enabled: true
    tag: note
    default-step: 10000

  segment-chain:
    enabled: true
    tag: note-chain
    default-step: 10000
    safe-distance: 2
    max-prefetch-distance: 1024
    prefetch-period: 1s
    prefetch-retry-count: 3
    prefetch-retry-backoff: 50ms
    scheduler-pool-size: 4
    shutdown-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when_authorized
